<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Happy Girlfriend Day</title>
  <style>
    :root {
      --px: 0px;
      --py: 0px;
      --cream: rgba(255, 246, 232, 0.92);
      --soft: rgba(255, 255, 255, 0.8);
      --dim: rgba(255, 255, 255, 0.5);
      --pink: #ff9fbe;
      --gold: #ffe0a8;
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      width: 100%;
      min-height: 100%;
      margin: 0;
      overflow-x: hidden;
      background: #060817;
      color: var(--soft);
    }

    body {
      min-height: 100vh;
      min-height: 100svh;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      touch-action: manipulation;
    }

    .experience {
      position: fixed;
      inset: 0;
      overflow: hidden;
      background:
        radial-gradient(circle at 76% 22%, rgba(255, 230, 178, 0.16), transparent 11rem),
        radial-gradient(circle at 28% 78%, rgba(255, 127, 190, 0.13), transparent 21rem),
        radial-gradient(circle at 62% 115%, rgba(146, 227, 255, 0.1), transparent 28rem),
        linear-gradient(180deg, #050615 0%, #101335 48%, #24162f 100%);
      opacity: 0;
      animation: openSky 2s ease forwards;
    }

    .experience::after {
      content: "";
      position: absolute;
      inset: 0;
      background:
        linear-gradient(180deg, transparent 0 60%, rgba(8, 7, 18, 0.32) 100%),
        radial-gradient(circle at 50% 105%, rgba(255, 204, 232, 0.16), transparent 32rem);
      pointer-events: none;
    }

    .aurora {
      position: fixed;
      inset: -18% -24% 34%;
      background:
        linear-gradient(104deg, transparent 13%, rgba(99, 236, 219, 0.22) 28%, transparent 47%),
        linear-gradient(73deg, transparent 18%, rgba(255, 116, 186, 0.28) 42%, transparent 65%),
        linear-gradient(128deg, transparent 36%, rgba(185, 151, 255, 0.24) 58%, transparent 78%);
      filter: blur(30px) saturate(1.12);
      mix-blend-mode: screen;
      opacity: 0.42;
      transform: translate3d(calc(-5% + var(--px) * 0.35), calc(var(--py) * 0.25), 0) skewY(-7deg);
      animation: auroraFlow 18s ease-in-out infinite alternate;
      transition: opacity 1.4s ease, filter 1.4s ease;
      pointer-events: none;
    }

    .aurora.blessed {
      opacity: 0.68;
      filter: blur(25px) saturate(1.28);
    }

    .moon {
      position: fixed;
      top: clamp(2.4rem, 7vw, 5.7rem);
      right: clamp(1.4rem, 9vw, 8.5rem);
      width: clamp(5.1rem, 12vw, 8.6rem);
      aspect-ratio: 1;
      border-radius: 50%;
      background:
        radial-gradient(circle at 35% 29%, rgba(255, 255, 255, 0.65) 0 7%, transparent 8%),
        radial-gradient(circle at 64% 64%, rgba(194, 158, 124, 0.18) 0 9%, transparent 10%),
        radial-gradient(circle at 42% 62%, rgba(185, 151, 118, 0.14) 0 12%, transparent 13%),
        #fff0c4;
      box-shadow:
        0 0 2.3rem rgba(255, 232, 187, 0.58),
        0 0 7.2rem rgba(255, 185, 219, 0.24);
      opacity: 0;
      transform: translate3d(calc(var(--px) * -0.25), calc(0.9rem + var(--py) * -0.18), 0) scale(0.94);
      animation: moonAppear 2.4s 0.25s ease forwards, moonBreath 9s 2.7s ease-in-out infinite;
      pointer-events: none;
      z-index: 2;
    }

    .stars,
    .fireflies,
    .float-hearts,
    .effects {
      position: fixed;
      inset: 0;
      overflow: hidden;
      pointer-events: none;
    }

    .stars {
      z-index: 1;
      transform: translate3d(calc(var(--px) * 0.18), calc(var(--py) * 0.18), 0);
      transition: filter 1.8s ease, opacity 1.8s ease;
    }

    .stars.brighter {
      filter: brightness(1.45);
      opacity: 1;
    }

    .star {
      position: absolute;
      left: var(--x);
      top: var(--y);
      width: var(--s);
      height: var(--s);
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.92);
      box-shadow: 0 0 0.8rem rgba(255, 255, 255, 0.6);
      opacity: 0.7;
      animation: starPulse var(--d) ease-in-out infinite alternate;
      animation-delay: var(--delay);
    }

    .fireflies {
      z-index: 3;
      transform: translate3d(calc(var(--px) * -0.12), calc(var(--py) * -0.08), 0);
    }

    .firefly {
      position: absolute;
      left: var(--x);
      top: var(--y);
      width: 0.32rem;
      height: 0.32rem;
      border-radius: 50%;
      background: var(--gold);
      box-shadow: 0 0 0.8rem #ffd58b, 0 0 1.7rem rgba(255, 186, 122, 0.58);
      opacity: 0.62;
      animation: drift var(--d) ease-in-out infinite alternate, fireGlow 3.3s ease-in-out infinite;
      animation-delay: var(--delay);
    }

    .float-hearts {
      z-index: 3;
    }

    .floating-heart {
      position: absolute;
      left: var(--x);
      top: var(--y);
      color: rgba(255, 171, 206, 0.35);
      font-size: var(--s);
      line-height: 1;
      text-shadow: 0 0 1.1rem rgba(255, 134, 185, 0.34);
      animation: slowHeart var(--d) ease-in-out infinite alternate;
      animation-delay: var(--delay);
    }

    .story-wrap {
      position: relative;
      z-index: 5;
      min-height: 100vh;
      min-height: 100svh;
      display: flex;
      align-items: center;
      padding: clamp(5rem, 10vh, 7rem) clamp(1.15rem, 6vw, 5rem) 5rem;
    }

    .story {
      width: min(550px, 92vw);
      margin-left: clamp(0rem, 42vw - 275px, 42vw);
      transform: translate3d(calc(var(--px) * 0.06), calc(var(--py) * 0.04), 0);
      text-shadow: 0 0 1.2rem rgba(255, 211, 234, 0.26);
    }

    .line {
      margin: 0 0 26px;
      max-width: 100%;
      color: rgba(255, 255, 255, 0.84);
      font-size: clamp(1.2rem, 2.25vw, 1.5rem);
      line-height: 1.85;
      letter-spacing: 0;
      overflow-wrap: anywhere;
      opacity: 0;
      transform: translateY(0.45rem);
      animation: lineIn 0.9s ease forwards;
    }

    .line.hello {
      font-family: Georgia, "Times New Roman", serif;
      font-size: 18px;
      color: rgba(255, 255, 255, 0.72);
      letter-spacing: 0;
    }

    .line.feature {
      margin: 0 0 30px;
      color: var(--cream);
      font-family: Georgia, "Times New Roman", serif;
      font-size: clamp(2.8rem, 7vw, 4rem);
      line-height: 1.12;
      text-shadow:
        0 0 1.2rem rgba(255, 186, 215, 0.46),
        0 0 3.8rem rgba(255, 225, 240, 0.16);
    }

    .line.symbol {
      font-size: clamp(2rem, 6vw, 3.2rem);
      line-height: 1.2;
      color: #fff8fb;
    }

    .line.cursor::after {
      content: "";
      display: inline-block;
      width: 0.08em;
      height: 1em;
      margin-left: 0.16em;
      vertical-align: -0.14em;
      background: rgba(255, 239, 247, 0.9);
      box-shadow: 0 0 0.75rem rgba(255, 215, 235, 0.8);
      animation: caret 1s steps(2, end) infinite;
    }

    .continue {
      position: fixed;
      z-index: 8;
      left: 50%;
      bottom: clamp(4.7rem, 9vh, 6.6rem);
      transform: translateX(-50%) scale(0.9);
      border: 1px solid rgba(255, 255, 255, 0.2);
      border-radius: 999px;
      padding: 0.72rem 1.05rem;
      color: rgba(255, 255, 255, 0.92);
      background: rgba(255, 255, 255, 0.075);
      box-shadow: 0 0.9rem 2.4rem rgba(255, 128, 188, 0.18), inset 0 1px 0 rgba(255, 255, 255, 0.1);
      backdrop-filter: blur(10px);
      font: 600 0.92rem/1 system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      letter-spacing: 0;
      cursor: pointer;
      opacity: 0;
      pointer-events: none;
      transition: opacity 1s ease, transform 1s ease, background 220ms ease, box-shadow 220ms ease;
    }

    .continue.visible {
      opacity: 1;
      transform: translateX(-50%) scale(1);
      pointer-events: auto;
    }

    .continue:hover,
    .continue:focus-visible {
      background: rgba(255, 255, 255, 0.13);
      box-shadow: 0 1rem 2.7rem rgba(255, 128, 188, 0.27);
      outline: none;
    }

    .final-note {
      position: fixed;
      z-index: 7;
      left: 50%;
      top: 50%;
      width: min(92vw, 45rem);
      transform: translate(-50%, -50%) scale(0.98);
      color: #fff8fb;
      font-family: Georgia, "Times New Roman", serif;
      font-size: clamp(2.1rem, 7.2vw, 4.6rem);
      line-height: 1.12;
      text-align: center;
      text-shadow: 0 0 1.4rem rgba(255, 159, 196, 0.52), 0 0 4.5rem rgba(255, 244, 249, 0.2);
      opacity: 0;
      pointer-events: none;
      transition: opacity 1.3s ease, transform 1.3s ease;
    }

    .final-note.show {
      opacity: 1;
      transform: translate(-50%, -50%) scale(1);
    }

    footer {
      position: fixed;
      z-index: 6;
      left: 50%;
      bottom: max(0.8rem, env(safe-area-inset-bottom));
      transform: translateX(-50%);
      width: min(92vw, 30rem);
      color: rgba(255, 255, 255, 0.5);
      font: 400 clamp(13px, 2.5vw, 14px)/1.4 system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      text-align: center;
      opacity: 0;
      animation: footerFade 1.6s 2s ease forwards;
      pointer-events: none;
    }

    .ripple {
      position: fixed;
      z-index: 4;
      left: var(--x);
      top: var(--y);
      width: 1rem;
      height: 1rem;
      border: 1px solid rgba(255, 230, 244, 0.62);
      border-radius: 50%;
      transform: translate(-50%, -50%) scale(0);
      pointer-events: none;
      animation: ripple 1.25s ease-out forwards;
    }

    .shooting-star {
      position: fixed;
      z-index: 6;
      top: var(--y);
      left: -10rem;
      width: clamp(5rem, 12vw, 8.5rem);
      height: 2px;
      border-radius: 999px;
      background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.96));
      box-shadow: 0 0 1rem rgba(255, 255, 255, 0.75);
      transform: rotate(-18deg);
      pointer-events: none;
      animation: shoot 1.65s ease-out forwards;
    }

    .burst-heart {
      position: fixed;
      z-index: 9;
      left: var(--x);
      top: var(--y);
      color: rgba(255, 171, 205, 0.94);
      font-size: var(--s);
      line-height: 1;
      text-shadow: 0 0 1rem rgba(255, 127, 185, 0.78);
      pointer-events: none;
      transform: translate(-50%, -50%);
      animation: burst 1.8s cubic-bezier(0.18, 0.84, 0.32, 1) forwards;
    }

    @keyframes openSky {
      to { opacity: 1; }
    }

    @keyframes auroraFlow {
      0% { translate: -4% -1%; }
      100% { translate: 6% 3%; }
    }

    @keyframes moonAppear {
      to {
        opacity: 1;
        transform: translate3d(calc(var(--px) * -0.25), calc(var(--py) * -0.18), 0) scale(1);
      }
    }

    @keyframes moonBreath {
      50% { filter: brightness(1.08); }
    }

    @keyframes starPulse {
      0% { opacity: 0.26; transform: scale(0.78); }
      100% { opacity: 1; transform: scale(1.12); }
    }

    @keyframes drift {
      100% { transform: translate3d(var(--dx), var(--dy), 0); }
    }

    @keyframes fireGlow {
      50% { opacity: 1; box-shadow: 0 0 1rem #ffe2a0, 0 0 2.2rem rgba(255, 191, 124, 0.72); }
    }

    @keyframes slowHeart {
      100% { transform: translate3d(0.7rem, -1.8rem, 0) rotate(7deg); opacity: 0.62; }
    }

    @keyframes lineIn {
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    @keyframes caret {
      50% { opacity: 0; }
    }

    @keyframes footerFade {
      to { opacity: 1; }
    }

    @keyframes ripple {
      100% {
        opacity: 0;
        transform: translate(-50%, -50%) scale(13);
      }
    }

    @keyframes shoot {
      100% {
        opacity: 0;
        transform: translate3d(125vw, 34vh, 0) rotate(-18deg);
      }
    }

    @keyframes burst {
      100% {
        opacity: 0;
        transform: translate(calc(-50% + var(--dx)), calc(-50% + var(--dy))) rotate(var(--r)) scale(0.42);
      }
    }

    @media (max-width: 900px) {
      .story-wrap {
        align-items: center;
        padding-inline: clamp(1.2rem, 7vw, 4rem);
      }

      .story {
        margin-left: clamp(0rem, 13vw, 5rem);
      }
    }

    @media (max-width: 640px) {
      .story-wrap {
        align-items: center;
        padding: 5.2rem 1.15rem 5.6rem;
      }

      .story {
        width: 100%;
        margin-left: 0.35rem;
      }

      .line {
        margin-bottom: 20px;
        font-size: clamp(1.05rem, 5vw, 1.26rem);
        line-height: 1.72;
      }

      .line.feature {
        margin-bottom: 24px;
        font-size: clamp(2.55rem, 13vw, 4rem);
      }

      .moon {
        right: 1.25rem;
      }
    }

    @media (max-height: 720px) {
      .story-wrap {
        align-items: flex-start;
        padding-top: 5rem;
      }

      .line {
        margin-bottom: 18px;
        line-height: 1.58;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      *,
      *::before,
      *::after {
        animation-duration: 0.01ms !important;
        animation-iteration-count: 1 !important;
        scroll-behavior: auto !important;
        transition-duration: 0.01ms !important;
      }
    }
  </style>
</head>
<body>
  <div class="experience" aria-hidden="true"></div>
  <div class="aurora" aria-hidden="true"></div>
  <div class="moon" aria-hidden="true"></div>
  <div class="stars" aria-hidden="true"></div>
  <div class="fireflies" aria-hidden="true"></div>
  <div class="float-hearts" aria-hidden="true"></div>
  <div class="effects" aria-hidden="true"></div>

  <main class="story-wrap">
    <section class="story" aria-label="Surat cinta di bawah langit malam"></section>
  </main>

  <button class="continue" type="button">❤️ Continue</button>
  <div class="final-note" aria-live="polite"></div>
  <footer>Made with ❤️ by @daffa.reivan</footer>

  <script>
    const storyLines = [
      "Hai...",
      "Hari ini adalah hari yang spesial.",
      "Happy Girlfriend Day. ❤️",
      "Aku cuma ingin mengucapkan...",
      "Terima kasih.",
      "Terima kasih karena sudah hadir.",
      "Terima kasih karena sudah menjadi alasan banyak senyumku.",
      "Mungkin...",
      "Aku belum selalu menjadi yang terbaik.",
      "Masih banyak hal yang sedang aku pelajari.",
      "Tapi ada satu hal yang tidak pernah berubah.",
      "Aku selalu bersyukur.",
      "Karena bisa mengenalmu.",
      "Semoga...",
      "Hari-harimu selalu dipenuhi kebahagiaan.",
      "Semoga setiap langkahmu ditemani hal-hal baik.",
      "Semoga senyummu tidak pernah hilang.",
      "Dan semoga...",
      "Aku masih diberi kesempatan.",
      "Untuk terus membuat kenangan bersamamu.",
      "Happy Girlfriend Day.",
      "🤍"
    ];

    const story = document.querySelector(".story");
    const stars = document.querySelector(".stars");
    const fireflies = document.querySelector(".fireflies");
    const hearts = document.querySelector(".float-hearts");
    const effects = document.querySelector(".effects");
    const aurora = document.querySelector(".aurora");
    const continueButton = document.querySelector(".continue");
    const finalNote = document.querySelector(".final-note");

    const random = (min, max) => Math.random() * (max - min) + min;
    const wait = ms => new Promise(resolve => setTimeout(resolve, ms));

    function buildAtmosphere() {
      for (let i = 0; i < 92; i += 1) {
        const star = document.createElement("span");
        star.className = "star";
        star.style.setProperty("--x", random(2, 98) + "%");
        star.style.setProperty("--y", random(3, 84) + "%");
        star.style.setProperty("--s", random(1, 2.6) + "px");
        star.style.setProperty("--d", random(3.5, 8.5) + "s");
        star.style.setProperty("--delay", random(-8, 0) + "s");
        stars.appendChild(star);
      }

      for (let i = 0; i < 25; i += 1) {
        addFirefly(fireflies, true);
      }

      for (let i = 0; i < 6; i += 1) {
        const heart = document.createElement("span");
        heart.className = "floating-heart";
        heart.textContent = "♥";
        heart.style.setProperty("--x", random(8, 92) + "%");
        heart.style.setProperty("--y", random(36, 86) + "%");
        heart.style.setProperty("--s", random(0.85, 1.25) + "rem");
        heart.style.setProperty("--d", random(9, 15) + "s");
        heart.style.setProperty("--delay", random(-9, 0) + "s");
        hearts.appendChild(heart);
      }
    }

    function addFirefly(parent, offsetDelay) {
      const fly = document.createElement("span");
      fly.className = "firefly";
      fly.style.setProperty("--x", random(4, 96) + "%");
      fly.style.setProperty("--y", random(42, 94) + "%");
      fly.style.setProperty("--dx", random(-70, 70) + "px");
      fly.style.setProperty("--dy", random(-85, 35) + "px");
      fly.style.setProperty("--d", random(7, 15) + "s");
      fly.style.setProperty("--delay", offsetDelay ? random(-12, 0) + "s" : "0s");
      parent.appendChild(fly);
      return fly;
    }

    function lineClass(text, index) {
      if (index === 0) return "line hello";
      if (text.includes("Happy Girlfriend Day")) return "line feature";
      if (text === "🤍") return "line symbol";
      return "line";
    }

    async function typeText(target, text) {
      const chars = Array.from(text);
      for (const char of chars) {
        target.textContent += char;
        await wait(char === "." ? 120 : random(38, 66));
      }
    }

    async function playStory() {
      await wait(2000);

      for (let i = 0; i < storyLines.length; i += 1) {
        const line = document.createElement("p");
        line.className = lineClass(storyLines[i], i) + " cursor";
        story.appendChild(line);
        await typeText(line, storyLines[i]);
        line.classList.remove("cursor");
        line.scrollIntoView({ behavior: "smooth", block: "center" });
        await wait(i === 0 ? 650 : 980);
      }

      await wait(1200);
      stars.classList.add("brighter");
      aurora.classList.add("blessed");
      launchShootingStar();
      await wait(900);
      continueButton.classList.add("visible");
    }

    function launchShootingStar() {
      const star = document.createElement("span");
      star.className = "shooting-star";
      star.style.setProperty("--y", random(10, 36) + "vh");
      effects.appendChild(star);
      star.addEventListener("animationend", () => star.remove());
    }

    function ripple(x, y) {
      const ring = document.createElement("span");
      ring.className = "ripple";
      ring.style.setProperty("--x", x + "px");
      ring.style.setProperty("--y", y + "px");
      effects.appendChild(ring);
      ring.addEventListener("animationend", () => ring.remove());
    }

    function heartBurst(x, y) {
      for (let i = 0; i < 24; i += 1) {
        const heart = document.createElement("span");
        heart.className = "burst-heart";
        heart.textContent = i % 3 === 0 ? "♡" : "♥";
        heart.style.setProperty("--x", x + "px");
        heart.style.setProperty("--y", y + "px");
        heart.style.setProperty("--dx", random(-165, 165) + "px");
        heart.style.setProperty("--dy", random(-190, 70) + "px");
        heart.style.setProperty("--r", random(-55, 55) + "deg");
        heart.style.setProperty("--s", random(0.85, 1.8) + "rem");
        effects.appendChild(heart);
        heart.addEventListener("animationend", () => heart.remove());
      }
    }

    async function continueScene(event) {
      const rect = continueButton.getBoundingClientRect();
      const x = event.clientX || rect.left + rect.width / 2;
      const y = event.clientY || rect.top + rect.height / 2;
      continueButton.disabled = true;
      continueButton.classList.remove("visible");
      aurora.classList.add("blessed");
      heartBurst(x, y);
      launchShootingStar();

      for (let i = 0; i < 16; i += 1) {
        setTimeout(() => {
          const fly = addFirefly(effects, false);
          setTimeout(() => fly.remove(), 8500);
        }, i * 100);
      }

      await wait(800);
      finalNote.textContent = "You're the best part of my story.";
      finalNote.classList.add("show");
      await wait(3200);
      finalNote.classList.remove("show");
      await wait(1150);
      finalNote.textContent = "Happy Girlfriend Day ❤️";
      finalNote.classList.add("show");
    }

    window.addEventListener("pointerdown", event => {
      ripple(event.clientX, event.clientY);
    }, { passive: true });

    window.addEventListener("pointermove", event => {
      const x = (event.clientX / window.innerWidth - 0.5) * 18;
      const y = (event.clientY / window.innerHeight - 0.5) * 14;
      document.documentElement.style.setProperty("--px", x + "px");
      document.documentElement.style.setProperty("--py", y + "px");
    }, { passive: true });

    continueButton.addEventListener("click", continueScene);
    setInterval(launchShootingStar, random(15000, 20000));

    buildAtmosphere();
    playStory();
  </script>
</body>
</html>
