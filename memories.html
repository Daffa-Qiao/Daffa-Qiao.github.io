<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Our Memories</title>
  <style>
    :root {
      --midnight: #050718;
      --deep: #151038;
      --purple: #39215e;
      --pink: #ff9fbe;
      --lavender: #c9b7ff;
      --warm: #fff7ee;
      --muted: rgba(255, 247, 238, 0.68);
      --line: rgba(255, 255, 255, 0.18);
      --shadow: 0 30px 90px rgba(0, 0, 0, 0.48);
      --px: 0px;
      --py: 0px;
    }

    * { box-sizing: border-box; }

    html,
    body {
      margin: 0;
      min-height: 100%;
      width: 100%;
      overflow: hidden;
      background: var(--midnight);
      color: var(--warm);
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    body {
      min-height: 100vh;
      min-height: 100svh;
      touch-action: manipulation;
    }

    button {
      font: inherit;
      color: inherit;
      border: 0;
      cursor: pointer;
      -webkit-tap-highlight-color: transparent;
    }

    .sky {
      position: fixed;
      inset: 0;
      overflow: hidden;
      background:
        radial-gradient(circle at 78% 18%, rgba(255, 229, 184, 0.16), transparent 12rem),
        radial-gradient(circle at 18% 72%, rgba(255, 159, 190, 0.14), transparent 22rem),
        radial-gradient(circle at 64% 110%, rgba(201, 183, 255, 0.16), transparent 30rem),
        linear-gradient(180deg, #040614 0%, #121139 46%, #2a1739 100%);
    }

    .sky::before {
      content: "";
      position: absolute;
      inset: -18% -24% 32%;
      background:
        linear-gradient(105deg, transparent 15%, rgba(95, 217, 227, 0.17) 32%, transparent 52%),
        linear-gradient(72deg, transparent 18%, rgba(255, 128, 189, 0.22) 43%, transparent 68%),
        linear-gradient(128deg, transparent 34%, rgba(186, 156, 255, 0.24) 59%, transparent 80%);
      filter: blur(32px) saturate(1.12);
      mix-blend-mode: screen;
      opacity: 0.48;
      transform: translate3d(calc(var(--px) * 0.32), calc(var(--py) * 0.2), 0) skewY(-7deg);
      animation: aurora 18s ease-in-out infinite alternate;
    }

    .sky::after {
      content: "";
      position: absolute;
      inset: 0;
      background:
        radial-gradient(circle at 50% 105%, rgba(255, 204, 232, 0.13), transparent 34rem),
        linear-gradient(180deg, transparent 0 58%, rgba(5, 4, 15, 0.42) 100%);
    }

    .moon {
      position: fixed;
      top: clamp(2rem, 7vw, 5.6rem);
      right: clamp(1.2rem, 8vw, 8rem);
      z-index: 2;
      width: clamp(4.7rem, 11vw, 8.4rem);
      aspect-ratio: 1;
      border-radius: 50%;
      background:
        radial-gradient(circle at 34% 30%, rgba(255, 255, 255, 0.68) 0 7%, transparent 8%),
        radial-gradient(circle at 64% 66%, rgba(159, 125, 101, 0.16) 0 10%, transparent 11%),
        #fff0c6;
      box-shadow: 0 0 2.5rem rgba(255, 232, 190, 0.58), 0 0 7rem rgba(255, 159, 190, 0.22);
      opacity: 0;
      transform: translate3d(calc(var(--px) * -0.22), calc(var(--py) * -0.16), 0) scale(0.92);
      animation: moonIn 1.9s 0.55s ease forwards, moonBreath 8s 2.6s ease-in-out infinite;
      pointer-events: none;
    }

    .stars,
    .particles,
    .hearts,
    .effects {
      position: fixed;
      inset: 0;
      z-index: 1;
      overflow: hidden;
      pointer-events: none;
    }

    .stars { opacity: 0; animation: layerIn 1.8s 0.15s ease forwards; }
    .stars.bright { filter: brightness(1.65); }
    .particles { z-index: 3; }
    .hearts { z-index: 3; opacity: 0.8; }
    .effects { z-index: 12; }

    .star,
    .particle {
      position: absolute;
      left: var(--x);
      top: var(--y);
      width: var(--s);
      height: var(--s);
      border-radius: 50%;
    }

    .star {
      background: rgba(255, 255, 255, 0.92);
      box-shadow: 0 0 0.75rem rgba(255, 255, 255, 0.58);
      animation: starPulse var(--d) ease-in-out infinite alternate;
      animation-delay: var(--delay);
    }

    .particle {
      background: rgba(255, 220, 168, 0.84);
      box-shadow: 0 0 1rem rgba(255, 200, 142, 0.7);
      animation: drift var(--d) ease-in-out infinite alternate, glow 3.6s ease-in-out infinite;
      animation-delay: var(--delay);
    }

    .heart {
      position: absolute;
      left: var(--x);
      top: var(--y);
      color: rgba(255, 166, 205, 0.42);
      font-size: var(--s);
      line-height: 1;
      text-shadow: 0 0 1rem rgba(255, 118, 178, 0.36);
      animation: floatHeart var(--d) ease-in-out infinite alternate;
      animation-delay: var(--delay);
    }

    .opening,
    .album {
      position: relative;
      z-index: 5;
      min-height: 100vh;
      min-height: 100svh;
    }

    .opening {
      display: grid;
      place-items: center;
      padding: 1.5rem;
      text-align: center;
      transition: opacity 900ms ease, transform 900ms ease;
    }

    .opening.hide {
      opacity: 0;
      transform: scale(1.02);
      pointer-events: none;
    }

    .opening-copy {
      width: min(92vw, 46rem);
      transform: translateY(0.3rem);
    }

    .whisper,
    .title,
    .open-button {
      opacity: 0;
      transform: translateY(0.65rem);
      animation: softIn 1.2s ease forwards;
    }

    .whisper {
      margin: 0 0 1.05rem;
      color: rgba(255, 247, 238, 0.7);
      font-family: Georgia, "Times New Roman", serif;
      font-size: clamp(1rem, 3.5vw, 1.22rem);
      animation-delay: 1.5s;
    }

    .title {
      margin: 0;
      color: #fff8fb;
      font-family: Georgia, "Times New Roman", serif;
      font-size: clamp(3.25rem, 12vw, 7.4rem);
      font-weight: 500;
      letter-spacing: 0;
      line-height: 1;
      text-shadow: 0 0 1.6rem rgba(255, 159, 190, 0.46), 0 0 4.5rem rgba(201, 183, 255, 0.2);
      animation-delay: 2.85s;
    }

    .open-button,
    .nav-button,
    .music-button {
      min-height: 44px;
      border: 1px solid rgba(255, 255, 255, 0.2);
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.075);
      box-shadow: 0 1rem 2.5rem rgba(255, 125, 185, 0.17), inset 0 1px 0 rgba(255, 255, 255, 0.1);
      backdrop-filter: blur(12px);
      transition: transform 220ms ease, background 220ms ease, box-shadow 220ms ease, opacity 220ms ease;
    }

    .open-button {
      margin-top: clamp(1.7rem, 5vw, 2.7rem);
      padding: 0.86rem 1.2rem;
      color: rgba(255, 255, 255, 0.92);
      font-weight: 650;
      animation-delay: 4.05s;
    }

    .open-button:hover,
    .nav-button:hover,
    .music-button:hover,
    .open-button:focus-visible,
    .nav-button:focus-visible,
    .music-button:focus-visible {
      background: rgba(255, 255, 255, 0.13);
      box-shadow: 0 1.1rem 2.9rem rgba(255, 125, 185, 0.28);
      outline: none;
      transform: translateY(-1px);
    }

    .album {
      display: none;
      align-items: center;
      justify-content: center;
      padding: clamp(4.1rem, 7vh, 5.5rem) clamp(1rem, 5vw, 4.5rem) clamp(5.8rem, 10vh, 7rem);
      opacity: 0;
      transition: opacity 800ms ease;
    }

    .album.active {
      display: flex;
      opacity: 1;
    }

    .scene {
      display: grid;
      grid-template-columns: minmax(240px, 0.96fr) minmax(230px, 0.74fr);
      align-items: center;
      gap: clamp(2rem, 7vw, 6.5rem);
      width: min(1120px, 100%);
      filter: blur(0);
      transition: filter 450ms ease;
    }

    .album.transitioning .scene { filter: blur(5px); }
    .scene.alt { grid-template-columns: minmax(230px, 0.72fr) minmax(260px, 1fr); }
    .scene.alt .photo-wrap { order: 2; }

    .photo-wrap {
      display: grid;
      place-items: center;
      perspective: 1000px;
    }

    .photo-print {
      width: min(var(--photo-w), 100%);
      max-width: 85vw;
      padding: clamp(0.65rem, 1.8vw, 0.95rem) clamp(0.65rem, 1.8vw, 0.95rem) clamp(2rem, 4vw, 3rem);
      border-radius: 4px;
      background: linear-gradient(180deg, #fffaf4, #f3e8de);
      box-shadow: var(--shadow), 0 0 3.8rem rgba(255, 159, 190, 0.22);
      transform: rotate(var(--rot)) scale(0.92);
      opacity: 0;
      transition: transform 700ms cubic-bezier(0.2, 0.8, 0.2, 1), opacity 650ms ease, box-shadow 240ms ease;
    }

    .photo-print.show {
      opacity: 1;
      transform: rotate(var(--rot)) scale(1);
    }

    .photo-print:hover {
      box-shadow: var(--shadow), 0 0 5rem rgba(255, 182, 213, 0.32);
    }

    .photo-button {
      display: block;
      width: 100%;
      padding: 0;
      background: transparent;
      border-radius: 2px;
      overflow: hidden;
    }

    .photo-button img {
      display: block;
      width: 100%;
      aspect-ratio: 4 / 5;
      object-fit: cover;
      background:
        linear-gradient(135deg, rgba(57, 33, 94, 0.74), rgba(255, 159, 190, 0.28)),
        #17122d;
      transition: transform 420ms ease, filter 420ms ease;
    }

    .photo-button:hover img { transform: scale(1.025); filter: saturate(1.06) brightness(1.03); }

    .copy {
      max-width: 29rem;
      opacity: 0;
      transform: translateY(0.8rem);
      transition: opacity 700ms ease, transform 700ms ease;
    }

    .copy.show {
      opacity: 1;
      transform: translateY(0);
    }

    .memory-label {
      margin: 0 0 1rem;
      color: var(--lavender);
      font-size: clamp(0.86rem, 2vw, 0.96rem);
      font-weight: 700;
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }

    .memory-text {
      min-height: 12rem;
      margin: 0;
      color: rgba(255, 247, 238, 0.9);
      font-family: Georgia, "Times New Roman", serif;
      font-size: clamp(1.42rem, 3.3vw, 2.28rem);
      line-height: 1.42;
      text-shadow: 0 0 1.1rem rgba(255, 188, 216, 0.22);
      white-space: pre-line;
    }

    .memory-text.typing::after {
      content: "";
      display: inline-block;
      width: 0.08em;
      height: 0.95em;
      margin-left: 0.16em;
      vertical-align: -0.12em;
      background: rgba(255, 238, 247, 0.92);
      box-shadow: 0 0 0.7rem rgba(255, 211, 233, 0.74);
      animation: caret 1s steps(2, end) infinite;
    }

    .closing {
      margin-top: 1.25rem;
      min-height: 5.8rem;
      color: #fff8fb;
      font-family: Georgia, "Times New Roman", serif;
      font-size: clamp(1.8rem, 5vw, 3.3rem);
      line-height: 1.1;
      text-shadow: 0 0 1.5rem rgba(255, 159, 190, 0.45);
      opacity: 0;
      transform: translateY(0.5rem);
      transition: opacity 850ms ease, transform 850ms ease;
    }

    .closing.show {
      opacity: 1;
      transform: translateY(0);
    }

    .single-next {
      margin-top: 1.25rem;
      padding: 0.78rem 1rem;
    }

    .memory-nav {
      position: fixed;
      left: 50%;
      bottom: max(1.05rem, env(safe-area-inset-bottom));
      z-index: 8;
      display: none;
      align-items: center;
      gap: clamp(0.55rem, 2vw, 1rem);
      transform: translateX(-50%);
    }

    .memory-nav.active { display: flex; }

    .nav-button {
      min-width: 7.1rem;
      padding: 0.72rem 0.95rem;
      color: rgba(255, 255, 255, 0.88);
      font-size: 0.92rem;
      font-weight: 650;
    }

    .nav-button:disabled {
      opacity: 0.38;
      cursor: default;
      transform: none;
    }

    .dots {
      display: flex;
      gap: 0.42rem;
      align-items: center;
      justify-content: center;
      min-width: 5.6rem;
      color: rgba(255, 255, 255, 0.44);
      font-size: 1.05rem;
      letter-spacing: 0;
      text-shadow: 0 0 0.8rem rgba(255, 255, 255, 0.2);
    }

    .dot.active { color: #fff8fb; }

    .music {
      position: fixed;
      top: max(1rem, env(safe-area-inset-top));
      left: max(1rem, env(safe-area-inset-left));
      z-index: 9;
      display: flex;
      align-items: center;
      gap: 0.55rem;
      opacity: 0;
      pointer-events: none;
      transition: opacity 700ms ease;
    }

    .music.active {
      opacity: 1;
      pointer-events: auto;
    }

    .music-button {
      display: grid;
      place-items: center;
      width: 2.85rem;
      padding: 0;
      font-size: 1rem;
    }

    .music span {
      color: rgba(255, 247, 238, 0.58);
      font-size: 0.78rem;
      text-shadow: 0 0 0.75rem rgba(255, 170, 205, 0.24);
    }

    .footer {
      position: fixed;
      left: 50%;
      bottom: max(0.65rem, env(safe-area-inset-bottom));
      z-index: 7;
      width: min(92vw, 28rem);
      transform: translateX(-50%);
      color: rgba(255, 247, 238, 0.56);
      font-size: 0.86rem;
      text-align: center;
      opacity: 0;
      pointer-events: none;
      transition: opacity 900ms ease;
    }

    .footer.show { opacity: 1; }

    .lightbox {
      position: fixed;
      inset: 0;
      z-index: 20;
      display: none;
      place-items: center;
      padding: 1.2rem;
      background: rgba(3, 4, 13, 0.72);
      backdrop-filter: blur(14px);
      opacity: 0;
      transition: opacity 260ms ease;
    }

    .lightbox.open {
      display: grid;
      opacity: 1;
    }

    .lightbox img {
      display: block;
      max-width: min(92vw, 820px);
      max-height: 88svh;
      border: 0.7rem solid #fffaf4;
      box-shadow: 0 2rem 6rem rgba(0, 0, 0, 0.62), 0 0 4rem rgba(255, 159, 190, 0.28);
      object-fit: contain;
      transform: scale(0.94);
      transition: transform 280ms ease;
    }

    .lightbox.open img { transform: scale(1); }

    .shooting-star {
      position: fixed;
      top: var(--y);
      left: -10rem;
      z-index: 13;
      width: clamp(5.5rem, 14vw, 9rem);
      height: 2px;
      border-radius: 999px;
      background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.96));
      box-shadow: 0 0 1rem rgba(255, 255, 255, 0.8);
      transform: rotate(-18deg);
      pointer-events: none;
      animation: shoot 1.65s ease-out forwards;
    }

    .burst-heart {
      position: fixed;
      left: var(--x);
      top: var(--y);
      z-index: 13;
      color: rgba(255, 172, 207, 0.92);
      font-size: var(--s);
      line-height: 1;
      text-shadow: 0 0 1rem rgba(255, 126, 185, 0.7);
      transform: translate(-50%, -50%);
      pointer-events: none;
      animation: burst 1.8s cubic-bezier(0.18, 0.84, 0.32, 1) forwards;
    }

    @keyframes aurora {
      0% { translate: -4% -1%; }
      100% { translate: 6% 3%; }
    }

    @keyframes layerIn { to { opacity: 1; } }

    @keyframes moonIn {
      to {
        opacity: 1;
        transform: translate3d(calc(var(--px) * -0.22), calc(var(--py) * -0.16), 0) scale(1);
      }
    }

    @keyframes moonBreath { 50% { filter: brightness(1.08); } }
    @keyframes starPulse { 0% { opacity: 0.24; transform: scale(0.76); } 100% { opacity: 1; transform: scale(1.14); } }
    @keyframes glow { 50% { opacity: 1; box-shadow: 0 0 1.2rem rgba(255, 212, 157, 0.84); } }
    @keyframes drift { 100% { transform: translate3d(var(--dx), var(--dy), 0); } }
    @keyframes floatHeart { 100% { opacity: 0.72; transform: translate3d(0.6rem, -1.7rem, 0) rotate(7deg); } }
    @keyframes softIn { to { opacity: 1; transform: translateY(0); } }
    @keyframes caret { 50% { opacity: 0; } }
    @keyframes shoot { to { opacity: 0; transform: translate3d(125vw, 34vh, 0) rotate(-18deg); } }
    @keyframes burst {
      to {
        opacity: 0;
        transform: translate(calc(-50% + var(--dx)), calc(-50% + var(--dy))) rotate(var(--r)) scale(0.42);
      }
    }

    @media (max-width: 800px) {
      html,
      body { overflow-y: auto; }

      .album {
        min-height: 100svh;
        padding: 5.6rem 1rem 7.2rem;
      }

      .scene,
      .scene.alt {
        grid-template-columns: 1fr;
        gap: 1.45rem;
        justify-items: center;
      }

      .scene.alt .photo-wrap { order: 0; }

      .copy {
        width: min(90vw, 30rem);
        text-align: center;
      }

      .memory-text {
        min-height: 10rem;
        font-size: clamp(1.25rem, 6vw, 1.78rem);
      }

      .memory-nav {
        width: min(94vw, 30rem);
        justify-content: space-between;
        gap: 0.35rem;
      }

      .nav-button {
        min-width: 5.9rem;
        padding-inline: 0.72rem;
        font-size: 0.85rem;
      }

      .dots { min-width: 4.6rem; }
    }

    @media (max-height: 590px) and (orientation: landscape) {
      html,
      body { overflow-y: auto; }

      .album {
        align-items: flex-start;
        padding-top: 4.4rem;
        padding-bottom: 5.8rem;
      }

      .scene,
      .scene.alt {
        grid-template-columns: minmax(180px, 0.75fr) minmax(230px, 1fr);
        gap: 1.6rem;
      }

      .scene.alt .photo-wrap { order: 2; }
      .photo-print { width: min(var(--photo-w), 42vw); }
      .memory-text { min-height: 7rem; font-size: clamp(1.12rem, 3.4vw, 1.45rem); }
    }

    @media (prefers-reduced-motion: reduce) {
      *,
      *::before,
      *::after {
        animation-duration: 0.01ms !important;
        animation-iteration-count: 1 !important;
        scroll-behavior: auto !important;
        transition-duration: 0.01ms !important;
      }
    }
  </style>
</head>
<body>
  <div class="sky" aria-hidden="true"></div>
  <div class="moon" aria-hidden="true"></div>
  <div class="stars" aria-hidden="true"></div>
  <div class="particles" aria-hidden="true"></div>
  <div class="hearts" aria-hidden="true"></div>
  <div class="effects" aria-hidden="true"></div>

  <main>
    <section class="opening" aria-label="Opening">
      <div class="opening-copy">
        <p class="whisper">Some moments are worth keeping...</p>
        <h1 class="title">Our Memories</h1>
        <button class="open-button" type="button">Open our memories ❤</button>
      </div>
    </section>

    <section class="album" aria-live="polite" aria-label="Our Memories">
      <div class="scene">
        <div class="photo-wrap">
          <figure class="photo-print">
            <button class="photo-button" type="button" aria-label="Lihat foto penuh">
              <img alt="Memory photo" />
            </button>
          </figure>
        </div>
        <article class="copy">
          <p class="memory-label"></p>
          <p class="memory-text"></p>
          <div class="closing" aria-live="polite"></div>
          <button class="nav-button single-next" type="button">Next memory →</button>
        </article>
      </div>
    </section>
  </main>

  <nav class="memory-nav" aria-label="Memory navigation">
    <button class="nav-button previous" type="button">← Previous</button>
    <div class="dots" aria-label="Memory indicator"></div>
    <button class="nav-button next" type="button">Next →</button>
  </nav>

  <aside class="music" aria-label="Music">
    <button class="music-button" type="button" aria-label="Play music">♪</button>
    <span>music</span>
    <audio src="music.mp3" preload="metadata"></audio>
  </aside>

  <footer class="footer">Made with ❤ by @daffa.reivan</footer>

  <div class="lightbox" role="dialog" aria-modal="true" aria-label="Fullscreen photo">
    <img alt="Memory photo fullscreen" />
  </div>

  <script>
    const memories = [
      {
        image: "foto1.jpg",
        label: "Memory #01",
        text: "Entah kenapa,\nmomen sederhana ini\nmasih menjadi salah satu\nyang paling aku ingat.",
        rotate: "-3.5deg",
        width: "500px",
        alt: "Memory pertama"
      },
      {
        image: "foto2.jpg",
        label: "Memory #02",
        text: "Kalau bisa mengulang waktu,\naku ingin kembali\nke momen ini sebentar saja.",
        rotate: "2.4deg",
        width: "610px",
        alt: "Memory kedua"
      },
      {
        image: "foto3.jpg",
        label: "Memory #03",
        text: "Lucunya...\n\nkadang kita tidak sadar\nbahwa sebuah hari biasa\nnantinya akan menjadi\nsebuah kenangan.",
        rotate: "-1.8deg",
        width: "540px",
        alt: "Memory ketiga"
      },
      {
        image: "foto4.jpg",
        label: "Memory #04",
        text: "Dan dari semua kenangan ini...\n\naku cuma berharap\nkita masih punya\nbanyak cerita lagi\nuntuk disimpan.",
        rotate: "1.2deg",
        width: "650px",
        alt: "Memory keempat"
      }
    ];

    const opening = document.querySelector(".opening");
    const openButton = document.querySelector(".open-button");
    const album = document.querySelector(".album");
    const scene = document.querySelector(".scene");
    const photoPrint = document.querySelector(".photo-print");
    const photoButton = document.querySelector(".photo-button");
    const photo = document.querySelector(".photo-button img");
    const copy = document.querySelector(".copy");
    const label = document.querySelector(".memory-label");
    const text = document.querySelector(".memory-text");
    const closing = document.querySelector(".closing");
    const singleNext = document.querySelector(".single-next");
    const nav = document.querySelector(".memory-nav");
    const previous = document.querySelector(".previous");
    const next = document.querySelector(".next");
    const dots = document.querySelector(".dots");
    const stars = document.querySelector(".stars");
    const particles = document.querySelector(".particles");
    const hearts = document.querySelector(".hearts");
    const effects = document.querySelector(".effects");
    const music = document.querySelector(".music");
    const musicButton = document.querySelector(".music-button");
    const audio = document.querySelector("audio");
    const footer = document.querySelector(".footer");
    const lightbox = document.querySelector(".lightbox");
    const lightboxImage = document.querySelector(".lightbox img");

    let active = 0;
    let typingToken = 0;
    let opened = false;
    const random = (min, max) => Math.random() * (max - min) + min;
    const wait = ms => new Promise(resolve => setTimeout(resolve, ms));
    const isMobile = () => window.matchMedia("(max-width: 800px)").matches;

    function makeAtmosphere() {
      for (let i = 0; i < 115; i += 1) {
        const star = document.createElement("span");
        star.className = "star";
        star.style.setProperty("--x", random(2, 98) + "%");
        star.style.setProperty("--y", random(2, 88) + "%");
        star.style.setProperty("--s", random(1, 2.7) + "px");
        star.style.setProperty("--d", random(3.5, 8.8) + "s");
        star.style.setProperty("--delay", random(-8, 0) + "s");
        stars.appendChild(star);
      }

      for (let i = 0; i < 26; i += 1) {
        const particle = document.createElement("span");
        particle.className = "particle";
        particle.style.setProperty("--x", random(4, 96) + "%");
        particle.style.setProperty("--y", random(28, 94) + "%");
        particle.style.setProperty("--s", random(2, 4.6) + "px");
        particle.style.setProperty("--dx", random(-70, 70) + "px");
        particle.style.setProperty("--dy", random(-80, 36) + "px");
        particle.style.setProperty("--d", random(8, 16) + "s");
        particle.style.setProperty("--delay", random(-14, 0) + "s");
        particles.appendChild(particle);
      }

      for (let i = 0; i < 7; i += 1) {
        addHeart(hearts, true);
      }
    }

    function addHeart(parent, delayed) {
      const heart = document.createElement("span");
      heart.className = "heart";
      heart.textContent = "♥";
      heart.style.setProperty("--x", random(9, 91) + "%");
      heart.style.setProperty("--y", random(36, 88) + "%");
      heart.style.setProperty("--s", random(0.75, 1.18) + "rem");
      heart.style.setProperty("--d", random(9, 16) + "s");
      heart.style.setProperty("--delay", delayed ? random(-12, 0) + "s" : "0s");
      parent.appendChild(heart);
      return heart;
    }

    async function typeMemory(value) {
      const token = ++typingToken;
      text.classList.add("typing");
      text.textContent = "";

      for (const character of Array.from(value)) {
        if (token !== typingToken) return;
        text.textContent += character;
        await wait(character === "." ? 110 : random(30, 56));
      }

      text.classList.remove("typing");
      if (active === memories.length - 1 && token === typingToken) {
        await finalMoment();
      }
    }

    async function showMemory(index) {
      active = Math.max(0, Math.min(index, memories.length - 1));
      const memory = memories[active];
      typingToken += 1;
      album.classList.add("transitioning");
      photoPrint.classList.remove("show");
      copy.classList.remove("show");
      closing.classList.remove("show");
      footer.classList.remove("show");
      await wait(opened ? 620 : 120);

      scene.classList.toggle("alt", active % 2 === 1);
      photoPrint.style.setProperty("--rot", memory.rotate);
      photoPrint.style.setProperty("--photo-w", memory.width);
      photo.src = memory.image;
      photo.alt = memory.alt;
      label.textContent = memory.label;
      text.textContent = "";
      closing.textContent = "";
      singleNext.hidden = active === memories.length - 1;
      updateNav();

      await wait(120);
      album.classList.remove("transitioning");
      photoPrint.classList.add("show");
      await wait(520);
      copy.classList.add("show");
      typeMemory(memory.text);
    }

    function updateNav() {
      dots.innerHTML = "";
      memories.forEach((_, index) => {
        const dot = document.createElement("span");
        dot.className = "dot" + (index === active ? " active" : "");
        dot.textContent = index === active ? "●" : "○";
        dots.appendChild(dot);
      });
      previous.disabled = active === 0;
      next.disabled = active === memories.length - 1;
    }

    async function openAlbum() {
      if (opened) return;
      opened = true;
      opening.classList.add("hide");
      music.classList.add("active");
      try {
        audio.volume = 0.48;
        await audio.play();
        musicButton.textContent = "❚❚";
      } catch (error) {
        musicButton.textContent = "♪";
      }
      await wait(820);
      opening.style.display = "none";
      album.classList.add("active");
      nav.classList.add("active");
      showMemory(0);
    }

    async function finalMoment() {
      stars.classList.add("bright");
      launchShootingStar();
      burstHearts(window.innerWidth / 2, window.innerHeight * 0.44, 18);
      await wait(1000);
      closing.textContent = "To be continued...\n\n❤";
      closing.classList.add("show");
      footer.classList.add("show");
    }

    function launchShootingStar() {
      const star = document.createElement("span");
      star.className = "shooting-star";
      star.style.setProperty("--y", random(9, 34) + "vh");
      effects.appendChild(star);
      star.addEventListener("animationend", () => star.remove());
    }

    function burstHearts(x, y, amount) {
      for (let i = 0; i < amount; i += 1) {
        const heart = document.createElement("span");
        heart.className = "burst-heart";
        heart.textContent = i % 3 === 0 ? "♡" : "♥";
        heart.style.setProperty("--x", x + random(-60, 60) + "px");
        heart.style.setProperty("--y", y + random(-40, 40) + "px");
        heart.style.setProperty("--dx", random(-170, 170) + "px");
        heart.style.setProperty("--dy", random(-190, 75) + "px");
        heart.style.setProperty("--r", random(-60, 60) + "deg");
        heart.style.setProperty("--s", random(0.8, 1.65) + "rem");
        effects.appendChild(heart);
        heart.addEventListener("animationend", () => heart.remove());
      }
    }

    function movePhoto(event) {
      if (!opened || isMobile() || active !== 1) return;
      const bounds = photoPrint.getBoundingClientRect();
      const x = (event.clientX - bounds.left) / bounds.width - 0.5;
      const y = (event.clientY - bounds.top) / bounds.height - 0.5;
      photoPrint.style.transform = "rotate(" + memories[active].rotate + ") scale(1) rotateY(" + (x * 7) + "deg) rotateX(" + (-y * 5) + "deg)";
    }

    function resetPhoto() {
      photoPrint.style.transform = "";
    }

    function openLightbox() {
      lightboxImage.src = memories[active].image;
      lightboxImage.alt = memories[active].alt;
      lightbox.classList.add("open");
    }

    function closeLightbox(event) {
      if (event.target === lightbox || event.key === "Escape") {
        lightbox.classList.remove("open");
      }
    }

    async function toggleMusic() {
      if (audio.paused) {
        try {
          await audio.play();
          musicButton.textContent = "❚❚";
        } catch (error) {
          musicButton.textContent = "♪";
        }
      } else {
        audio.pause();
        musicButton.textContent = "♪";
      }
    }

    openButton.addEventListener("click", openAlbum);
    singleNext.addEventListener("click", () => showMemory(active + 1));
    next.addEventListener("click", () => showMemory(active + 1));
    previous.addEventListener("click", () => showMemory(active - 1));
    photoButton.addEventListener("click", openLightbox);
    lightbox.addEventListener("click", closeLightbox);
    window.addEventListener("keydown", closeLightbox);
    photoPrint.addEventListener("pointermove", movePhoto, { passive: true });
    photoPrint.addEventListener("pointerleave", resetPhoto);
    musicButton.addEventListener("click", toggleMusic);
    audio.addEventListener("error", () => {
      musicButton.textContent = "♪";
      musicButton.title = "music.mp3 belum tersedia";
    });

    window.addEventListener("pointermove", event => {
      const x = (event.clientX / window.innerWidth - 0.5) * 18;
      const y = (event.clientY / window.innerHeight - 0.5) * 14;
      document.documentElement.style.setProperty("--px", x + "px");
      document.documentElement.style.setProperty("--py", y + "px");
    }, { passive: true });

    setInterval(() => {
      if (opened && Math.random() > 0.52) launchShootingStar();
    }, 17000);

    makeAtmosphere();
    updateNav();
  </script>
</body>
</html>
